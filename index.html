<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Observatoire Énergétique DC & Télécoms</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-left">
            <h1>⚡ Observatoire Énergétique</h1>
            <p>Secteurs : Informatique (62, 63) & Télécoms (61)</p>
        </div>
        
        <div class="stats">
            <div class="stat-box main-stat">
                <div class="stat-label">🏢 Total Sites</div>
                <div class="stat-value" id="dc-count">0</div>
            </div>
            <div class="stat-box sub-stat">
                <div class="stat-label">📞 Télécoms (61)</div>
                <div class="stat-value" id="count-61">0</div>
            </div>
            <div class="stat-box sub-stat">
                <div class="stat-label">💻 Prog/Conseil (62)</div>
                <div class="stat-value" id="count-62">0</div>
            </div>
            <div class="stat-box sub-stat">
                <div class="stat-label">🗄️ Data Centers (63)</div>
                <div class="stat-value" id="count-63">0</div>
            </div>
            <div class="stat-box main-stat">
                <div class="stat-label">⚡ Conso. Totale</div>
                <div class="stat-value" id="total-conso">- GWh</div>
            </div>
        </div>
    </header>

    <div class="controls">
        <button class="btn hidden" id="back-btn">⬅ Retour France globale</button>
        <button class="btn" id="ranking-btn">📊 Classement</button>
        
        <div class="filter-group">
            <select id="filter-naf" class="filter-select">
                <option value="all">Tous les secteurs (61, 62, 63)</option>
                <option value="63">NAF 63 (Data Centers)</option>
                <option value="61">NAF 61 (Télécommunications)</option>
                <option value="62">NAF 62 (Prog/Conseil)</option>
            </select>
            <select id="filter-conso" class="filter-select">
                <option value="all">Toutes consommations</option>
                <option value="high">🔴 Élevée (≥ 10 GWh)</option>
                <option value="medium">🟠 Moyenne (1 à 10 GWh)</option>
                <option value="low">🟢 Faible (< 1 GWh)</option>
            </select>
        </div>
    </div>

    <div id="map"></div>

    <div id="ranking-panel" class="hidden">
        <div class="panel-header">
            <button class="close-btn" id="close-ranking">×</button>
            <h2>🏆 Classement Départements</h2>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="conso">Par Consommation</button>
                <button class="filter-btn" data-filter="count">Par Nombre de Sites</button>
            </div>
        </div>
        <div id="ranking-list"></div>
    </div>

    <div id="sidebar" class="hidden">
        <button id="sidebar-back-btn" class="hidden">⬅ Retour Liste</button>
        <button class="close-btn" id="close-sidebar">×</button>
        
        <div class="sidebar-content">
            <div class="dc-header">
                <div id="dc-name">Nom du Site</div>
                <div id="dc-address">Adresse...</div>
                <div class="naf-badge" id="naf-badge">NAF</div>
            </div>

            <div class="info-section" id="conso-section">
                <div class="info-title" id="conso-title">Dernière Conso.</div>
                <div class="conso-display">
                    <div class="conso-value" id="dc-conso">-- GWh</div>
                    <div class="conso-bar-container">
                        <div id="conso-bar"></div>
                    </div>
                </div>
            </div>

            <div class="info-section">
                <div class="info-title" id="table-title">Historique de consommation</div>
                <table id="data-table">
                    <thead></thead>
                    <tbody id="history-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatoire Conso Data Centers</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1>⚡ Observatoire Énergétique DC</h1>
            <p>Visualisation Historique (Code NAF 63)</p>
        </div>
        <div class="stats-panel">
            <div class="stat-item">
                <span class="label">DCs Identifiés</span>
                <span class="value" id="dc-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">Conso. Totale 2023</span>
                <span class="value" id="total-conso">- GWh</span>
            </div>
        </div>

        <button id="back-btn" class="hidden">⬅ Retour France</button>
        <button id="ranking-btn">📊 Classement</button>
    </header>

    <main>
        <div id="ranking-panel" class="hidden">
            <div class="ranking-header">
                <h2>🏆 Classement Départements</h2>
                <button id="close-ranking">×</button>
            </div>
            <div class="ranking-filters">
                <button class="filter-btn active" data-filter="conso">Par Consommation</button>
                <button class="filter-btn" data-filter="count">Par Nombre DC</button>
            </div>
            <div id="ranking-list"></div>
        </div>
        <div id="map"></div>
        
        <div id="sidebar" class="hidden">
            <button id="close-sidebar">×</button>
            <h2 id="dc-name">Nom du DC</h2>
            <p class="address" id="dc-address">Adresse...</p>
            
            <div class="badges">
                <span class="badge" id="dc-naf">NAF 63.11Z</span>
                <span class="badge operator" id="dc-operator">-</span>
            </div>

            <div class="energy-box">
                <h3>Dernière Conso. (2023)</h3>
                <div class="conso-value" id="dc-conso">-- GWh</div>
                <div class="conso-bar-bg">
                    <div class="conso-bar-fill" id="conso-bar" style="width: 0%"></div>
                </div>
            </div>

            <div class="history-section">
                <h3>Historique de consommation</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Année</th>
                            <th>Conso (MWh)</th>
                            <th>Évolution</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
